<!DOCTYPE html>
<html>
<head>
    <title>Recommended Outfit</title>
    <style>
        body { 
            font-family:'Poppins', sans-serif; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            min-height:100vh; 
            background:#f5f5f5; 
            color:#6a0dad; 
        }
        .result-box { 
            background: rgba(255,255,255,0.95); 
            padding:30px; 
            border-radius:20px; 
            width:400px; 
            text-align:center; 
            box-shadow:0 8px 25px rgba(0,0,0,0.2); 
        }
        /* ✅ Resize all outfit images */
        img { 
            max-width: 300px; 
            width: 100%; 
            height: auto; 
            border-radius: 15px; 
            margin-bottom: 15px; 
        }
        .go-back { 
            display:inline-block; 
            margin-top:15px; 
            padding:10px 25px; 
            border-radius:10px; 
            background:#ff4d6d; 
            color:white; 
            text-decoration:none; 
            font-weight:bold; 
            transition:0.3s; 
        }
        .go-back:hover { 
            opacity:0.9; 
            transform:translateY(-2px); 
        }
    </style>
</head>
<body>

<div class="result-box">
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    {% for item in results %}
        <img src="{{ url_for('static', filename=item.image) }}" alt="Recommended Outfit">
        <p>{{ item.description }}</p>
    {% endfor %}

    <a href="/" class="go-back">Go Back</a>
</div>

</body>
</html>
