<!DOCTYPE html>
<html>
<head>
    <title>Fashion Recommendation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            height: 100vh;
            background: url("{{ url_for('static', filename='images/banner.jpg') }}") no-repeat center center/cover;
            display: flex;
            justify-content: flex-start; /* box on left side */
            align-items: center;
        }

        .container {
            background: rgba(255, 192, 203, 0.95); /* pinkish white box */
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            margin-left: 50px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 { color: #6a0dad; margin-bottom: 20px; font-size: 28px; }

        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; color: #6a0dad; }

        input::placeholder { color: #6a0dad; }

        select:focus, input:focus { outline: none; border: 2px solid #6a0dad; box-shadow: 0 0 10px #6a0dad; }

        button {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: #ff4d6d; color: white; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Fashion Finder 👗</h1>

    <form action="/recommend" method="post">
        <select name="event" required>
            <option value="">Select Event</option>
            <option value="casual">Casual</option>
            <option value="party">Party</option>
            <option value="interview">Interview</option>
            <option value="college">College</option>
            <option value="wedding">Wedding</option>
        </select>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <select name="weather" required>
            <option value="">Select Weather</option>
            <option value="hot">Hot</option>
            <option value="cold">Cold</option>
            <option value="rainy">Rainy</option>
        </select>

        <select name="style" required>
            <option value="">Select Style</option>
            <option value="modern">Modern</option>
            <option value="trendy">Trendy</option>
            <option value="formal">Formal</option>
            <option value="traditional">Traditional</option>
        </select>

        <select name="age" required>
            <option value="">Select Age Group</option>
            <option value="teen">Teen</option>
            <option value="adult">Adult</option>
        </select>

        <button type="submit">Get Outfit 🎯</button>
    </form>
</div>

</body>
</html>
